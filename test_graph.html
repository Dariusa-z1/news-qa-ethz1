        <script type="text/javascript">

              // initialize global variables.

              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "blue", "id": "article_1", "label": "ETH AI Research Breakthrough", "shape": "dot", "title": "Article: ETH AI Research Breakthrough\nLanguage: en"}, {"color": "green", "id": "ORG_ETH Zurich", "label": "ETH Zurich", "shape": "dot", "title": "Type: ORG"}, {"color": "gray", "id": "ORG_AI", "label": "ORG_AI", "shape": "dot", "title": "Type: MISC"}, {"color": "gray", "id": "PERSON_Smith", "label": "PERSON_Smith", "shape": "dot", "title": "Type: MISC"}, {"color": "blue", "id": "article_2", "label": "KI-Forschung an der ETH", "shape": "dot", "title": "Article: KI-Forschung an der ETH\nLanguage: de"}, {"color": "green", "id": "ORG_ETH Z\u00fcrich", "label": "ETH Z\u00fcrich", "shape": "dot", "title": "Type: ORG"}, {"color": "gray", "id": "ORG_KI-Modell", "label": "ORG_KI-Modell", "shape": "dot", "title": "Type: MISC"}, {"color": "gray", "id": "PER_Smith", "label": "PER_Smith", "shape": "dot", "title": "Type: MISC"}, {"color": "blue", "id": "article_3", "label": "Climate Research Initiative", "shape": "dot", "title": "Article: Climate Research Initiative\nLanguage: en"}]);

};
