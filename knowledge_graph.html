in an improved detailed view. The app is newly equipped with event and news filters and offers a complete ETH building directory. Find out what\u0027s an the menu at any campus canteen and look up colleagues and professors too.\nLanguage: en"}, {"color": "blue", "id": "article_en_2013_12_eth-zurich-a-smart-choice-for-science-and-family", "label": "To maintain its position as a leading research and academic institution, ETH Zurich endeavours to attract the most highly qualified scientists. In recent years, recruitement has expanded to include international candidates. In fact, the number of non-Swiss professors has significantly increased over the last decade. Today, 34.7% of the ETH Zurich faculty are from abroad.", "shape": "dot", "title": "Article: To maintain its position as a leading research and academic institution, ETH Zurich endeavours to attract the most highly qualified scientists. In recent years, recruitement has expanded to include international candidates. In fact, the number of non-Swiss professors has significantly increased over the last decade. Today, 34.7% of the ETH Zurich faculty are from abroad.\nLanguage: en"}, {"color": "blue", "id": "article_en_2014_03_neu-an-der-eth-anthony-patt-", "label": "What motivated you to come to ETH Zurich? Anthony Patt: Actually I had three motivations. The first is, I really enjoy doing social science research in an atmosphere that is mainly concerned with natural sciences questions. The second motivation was that at ETH you find the same collegiality like at the very good American universities. And the third point is that I just love Zurich!", "shape": "dot", "title": "Article: What motivated you to come to ETH Zurich? Anthony Patt: Actually I had three motivations. The first is, I really enjoy doing social science research in an atmosphere that is mainly concerned with natural sciences questions. The second motivation was that at ETH you find the same collegiality like at the very good American universities. And the third point is that I just love Zurich!\nLanguage: en"}, {"color": "blue", "id": "article_en_2014_03_Uploading-publications-onto-E-Collection-directly-from-E-Citations", "label": "When entering a reference in ETH E-Citations, select the option \"Publish in E-Collection\", which enables you to upload a full text directly for publication in ETH E-Collection . The ETH-Bibliothek team will then verify the legal parameters and publish your document. It also guarantees the link from ETH E-Citations .", "shape": "dot", "title": "Article: When entering a reference in ETH E-Citations, select the option \"Publish in E-Collection\", which enables you to upload a full text directly for publication in ETH E-Collection . The ETH-Bibliothek team will then verify the legal parameters and publish your document. It also guarantees the link from ETH E-Citations .\nLanguage: en"}, {"color": "blue", "id": "article_en_2014_03_women-on-the-playing-field", "label": "In my first column, I wrote about my personal experience as a female professor at ETH Zurich. Today, with the help of my colleague Prof. Janet Hering (WPF Vice President), I would like to comment on a topic that is particularly timely, namely the election of the next ETH Rector.", "shape": "dot", "title": "Article: In my first column, I wrote about my personal experience as a female professor at ETH Zurich. Today, with the help of my colleague Prof. Janet Hering (WPF Vice President), I would like to comment on a topic that is particularly timely, namely the election of the next ETH Rector.\nLanguage: en"}, {"color": "blue", "id": "article_en_2014_03_early-practice-makes-perfect", "label": "Early Practice Makes Perfect", "shape": "dot", "title": "Article: Early Practice Makes Perfect\nLanguage: en"}, {"color": "blue", "id": "article_en_2014_03_we-built-this-city-from-waste", "label": "\u201cEventually, the future city would make no distinction between waste and supply (...)\u201d - Mitchell Joachim", "shape": "dot", "title": "Article: \u201cEventually, the future city would make no distinction between waste and supply (...)\u201d - Mitchell Joachim\nLanguage: en"}, {"color": "blue", "id": "article_en_2014_03_citavi-reference-management%20", "label": "You will learn, for example:", "shape": "dot", "title": "Article: You will learn, for example:\nLanguage: en"}, {"color": "blue", "id": "article_en_2014_03_not-without-us", "label": "\u201cLife is what happens while you\u0027re busy making other plans\u201d \u2013 the quote on the door to my office could hardly be a more precise description of how the weeks after 9 February passed for VSETH. The meticulously planned projects for February and March, which included installing an ice rink on H\u00f6nggerberg, issuing a statement on the election of the Rector and conducting targeted lobbying in the National Council in relation to tuition fees, among other things, were suddenly dwarfed by a new topic: the mass immigration initiative and its effects on the European education and research programmes of Erasmus+ and Horizon 2020.", "shape": "dot", "title": "Article: \u201cLife is what happens while you\u0027re busy making other plans\u201d \u2013 the quote on the door to my office could hardly be a more precise description of how the weeks after 9 February passed for VSETH. The meticulously planned projects for February and March, which included installing an ice rink on H\u00f6nggerberg, issuing a statement on the election of the Rector and conducting targeted lobbying in the National Council in relation to tuition fees, among other things, were suddenly dwarfed by a new topic: the mass immigration initiative and its effects on the European education and research programmes of Erasmus+ and Horizon 2020.\nLanguage: en"}, {"color": "blue", "id": "article_en_2014_04_a-plea-for-dual-careers", "label": "In my last column I outlined the potential differences in the experiences of female and male professors likely to persist as long as there are so few women in STEM fields. With this column, I would again like to relate my own experiences to broaden the discussion on dual career opportunities as they have affected my own life and career.", "shape": "dot", "title": "Article: In my last column I outlined the potential differences in the experiences of female and male professors likely to persist as long as there are so few women in STEM fields. With this column, I would again like to relate my own experiences to broaden the discussion on dual career opportunities as they have affected my own life and career.\nLanguage: en"}, {"color": "blue", "id": "article_en_2014_04_ipad-for-study-and-work", "label": "Subjects covered:", "shape": "dot", "title": "Article: Subjects covered:\nLanguage: en"}, {"color": "blue", "id": "article_en_2014_04_vertical-networking", "label": "When the National Research Foundation of Singapore (NRF) first came up with the idea of uniting many different universities to conduct their research projects in one educational hub in 2009, a lot of focus was placed on the uniqueness of such an academic community and the interaction opportunities this would generate.", "shape": "dot", "title": "Article: When the National Research Foundation of Singapore (NRF) first came up with the idea of uniting many different universities to conduct their research projects in one educational hub in 2009, a lot of focus was placed on the uniqueness of such an academic community and the interaction opportunities this would generate.\nLanguage: en"}, {"color": "blue", "id": "article_en_2014_04_security-gap-heartbleed", "label": "A big issue in the last days was the vulnerability called \u00abHeartbleed\u00bb, which affects, for example, web stores, Internet banking or in general all web services accessed over SLL (\u00abhttps\u00bb).", "shape": "dot", "title": "Article: A big issue in the last days was the vulnerability called \u00abHeartbleed\u00bb, which affects, for example, web stores, Internet banking or in gener
